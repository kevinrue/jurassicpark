      #     echo ("PYENV_ROOT=" + $env:USERPROFILE + "\.pyenv\pyenv-win\") >> $env:GITHUB_ENV
      #     echo ("PYENV_HOME=" + $env:USERPROFILE + "\.pyenv\pyenv-win\") >> $env:GITHUB_ENV
      #     $env:USERPROFILE + "\.pyenv\pyenv-win\shims;" | Out-File -FilePath "$env:GITHUB_PATH" -Append
      #     $env:USERPROFILE + "\.pyenv\pyenv-win\bin;" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: Test pyenv (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash -leo pipefail {0}
        run: |
          pyenv --version

      - name: Test pyenv (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyenv --version

      - name: Test pyenv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh {0}
        run: |
          $env:Path = 'C:\Users\runneradmin\.pyenv\pyenv-win\bin;' + $env:Path
          $env:Path = 'C:\Users\runneradmin\.pyenv\pyenv-win\shims;' + $env:Path
          $env:PYENV = $env:USERPROFILE + '\.pyenv\pyenv-win\'
          $env:PYENV_ROOT = $env:USERPROFILE + '\.pyenv\pyenv-win\'
          $env:PYENV_HOME = $env:USERPROFILE + '\.pyenv\pyenv-win\'
          pyenv --version

      - name: List python 3.1x
        #if: runner.os == 'Linux'
        shell: bash -leo pipefail {0}
        run: |
          pyenv install --list | grep " 3\.1[12345]"
          pyenv --version

      - name: Install python build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash -leo pipefail {0}
        run: |
          apt update
          apt-get -yq install \
            build-essential \
            pkg-config \
            ccache \
            gdb \
            lcov \
            libb2-dev \
            libbz2-dev \
            libffi-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            libncurses5-dev \
            libreadline6-dev \
            libsqlite3-dev \
            libssl-dev \
            libzstd-dev \
            lzma \
            lzma-dev \
            strace \
            tk-dev \
            uuid-dev \
            xvfb \
            zlib1g-dev

      - name: Install python (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash -leo pipefail {0}
        run: |
          pyenv install 3.13.5

      - name: Test pyenv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh {0}
        run: |
          $env:Path = 'C:\Users\runneradmin\.pyenv\pyenv-win\bin;' + $env:Path
          $env:Path = 'C:\Users\runneradmin\.pyenv\pyenv-win\shims;' + $env:Path
          $env:PYENV = $env:USERPROFILE + '\.pyenv\pyenv-win\'
          $env:PYENV_ROOT = $env:USERPROFILE + '\.pyenv\pyenv-win\'
          $env:PYENV_HOME = $env:USERPROFILE + '\.pyenv\pyenv-win\'
          pyenv install 3.13.5

      - name: Install python in a virtual environment (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash -leo pipefail {0}
        run: |
          pyenv virtualenv 3.13.5 jurassicpark-env

      - name: Confirm presence of virtual environment (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash -leo pipefail {0}
        run: |
          pyenv shell jurassicpark-env
          pyenv virtualenvs

      - name: Install scvelo (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash -leo pipefail {0}
        run: |
          pyenv activate jurassicpark-env
          pip install --no-cache-dir scvelo==0.3.3

      - name: List installed packages (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash -leo pipefail {0}
        run: |
          pyenv activate jurassicpark-env
          python -m pip list --format=freeze

