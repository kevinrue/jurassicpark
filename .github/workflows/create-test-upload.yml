## Read more about the features of this GitHub Actions workflow
## at https://lcolladotor.github.io/biocthis/articles/biocthis.html#use_bioc_github_action
##
## For more details, check the biocthis developer notes vignette at
## https://lcolladotor.github.io/biocthis/articles/biocthis_dev_notes.html
##
## You can add this workflow to other packages using:
## > biocthis::use_bioc_github_action()
##
## Using GitHub Actions exposes you to many details about how R packages are
## compiled and installed in several operating systems.
### If you need help, please follow the steps listed at
## https://github.com/r-lib/actions#where-to-find-help
##
## If you found an issue specific to biocthis's GHA workflow, please report it
## with the information that will make it easier for others to help you.
## Thank you!

## Acronyms:
## * GHA: GitHub Action
## * OS: operating system

on:
  push:
  pull_request:

name: create-test-upload

## These environment variables control whether to run GHA code later on that is
## specific to testthat, covr, and pkgdown.
##
## If you need to clear the cache of packages, update the number inside
## cache-version as discussed at https://github.com/r-lib/actions/issues/86.
## Note that you can always run a GHA test without the cache by using the word
## "/nocache" in the commit message.
env:
  has_testthat: 'true'
  run_covr: 'true'
  run_pkgdown: 'true'
  has_RUnit: 'false'
  cache-version: 'cache-v1'
  run_docker: 'true'

jobs:
  build-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }}
    container: ${{ matrix.config.cont }}
    ## Environment variables unique to this job.

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, cont: "bioconductor/bioconductor_docker:devel", rspm: "https://packagemanager.rstudio.com/cran/__linux__/focal/latest" }
          - { os: macOS-latest }
          - { os: windows-latest }
          ## Check https://github.com/r-lib/actions/tree/master/examples
          ## for examples using the http-user-agent
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      NOT_CRAN: true
      TZ: UTC
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pyenv on Linux
        if: runner.os == 'Linux'
        shell: bash -leo pipefail {0}
        run: |
          curl -fsSL https://pyenv.run | bash

      - name: Install pyenv on macOS
        if: runner.os == 'macOS'
        shell: bash -leo pipefail {0}
        run: |
          brew update
          brew install pyenv

      - name: Install pyenv-win on Windows
        if: runner.os == 'Windows'
        shell: pwsh {0}
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/pyenv-win/pyenv-win/master/pyenv-win/install-pyenv-win.ps1" -OutFile "./install-pyenv-win.ps1"; &"./install-pyenv-win.ps1"

      - name: Install pyenv-virtualenv on macOS
        if: runner.os == 'macOS'
        shell: bash -leo pipefail {0}
        run: |
          brew update
          brew install pyenv-virtualenv

      - name: Configure pyenv on Linux
        if: runner.os == 'Linux'
        shell: bash -leo pipefail {0}
        run: |
          echo 'export PYENV_ROOT="$HOME/.pyenv"' >> ~/.bash_profile
          echo '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"' >> ~/.bash_profile
          echo 'eval "$(pyenv init - bash)"' >> ~/.bash_profile

      - name: Configure pyenv on macOS
        if: runner.os == 'macOS'
        shell: bash -leo pipefail {0}
        run: |
          echo 'export PYENV_ROOT="$HOME/.pyenv"' >> ~/.bash_profile
          echo '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"' >> ~/.bash_profile
          echo 'eval "$(pyenv init - bash)"' >> ~/.bash_profile

      - name: Configure pyenv on Windows
        if: runner.os == 'Windows'
        shell: pwsh {0}
        run: |
          chcp 65001
          echo ("PYENV=" + $env:USERPROFILE + "\.pyenv\pyenv-win") >> $env:GITHUB_ENV
          echo ("PYENV_ROOT=" + $env:USERPROFILE + "\.pyenv\pyenv-win") >> $env:GITHUB_ENV
          echo ("PYENV_HOME=" + $env:USERPROFILE + "\.pyenv\pyenv-win") >> $env:GITHUB_ENV
          $env:USERPROFILE + "\.pyenv\pyenv-win\shims;" | Out-File -FilePath "$env:GITHUB_PATH" -Append
          $env:USERPROFILE + "\.pyenv\pyenv-win\bin;" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: Verify pyenv on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash -leo pipefail {0}
        run: |
          pyenv --version

      - name: Verify pyenv on Windows
        if: runner.os == 'Windows'
        shell: pwsh {0}
        run: |
          pyenv --version

      - name: List Python 3.1x versions on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash -leo pipefail {0}
        run: |
          pyenv install --list | grep " 3\.1[12345]"

      - name: List Python 3.1x versions on Windows
        if: runner.os == 'Windows'
        shell: pwsh {0}
        run: |
          pyenv install -l | findstr 3.1

      - name: Install Python build dependencies on Linux
        if: runner.os == 'Linux'
        shell: bash -leo pipefail {0}
        run: |
          apt update
          apt-get -yq install \
            build-essential \
            pkg-config \
            ccache \
            gdb \
            lcov \
            libb2-dev \
            libbz2-dev \
            libffi-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            libncurses5-dev \
            libreadline6-dev \
            libsqlite3-dev \
            libssl-dev \
            libzstd-dev \
            lzma \
            lzma-dev \
            strace \
            tk-dev \
            uuid-dev \
            xvfb \
            zlib1g-dev

      - name: Install Python 3.13.5 on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash -leo pipefail {0}
        run: |
          pyenv install 3.13.5

      - name: Install Python 3.13.5 on Windows
        if: runner.os == 'Windows'
        shell: pwsh {0}
        run: |
          pyenv install 3.13.5

      - name: Create virtual environment on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash -leo pipefail {0}
        run: |
          pyenv virtualenv 3.13.5 jurassicpark-env

      - name: Verify virtual environment on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash -leo pipefail {0}
        run: |
          pyenv shell jurassicpark-env
          pyenv virtualenvs

      - name: Install scvelo dependencies on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash -leo pipefail {0}
        run: |
          pyenv activate jurassicpark-env
          python -m pip install scvelo==0.3.3 anndata==0.11.4 scipy==1.15.2 zarr==2.18.7 tqdm ipywidgets

      - name: Install scvelo dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh {0}
        run: |
          pyenv shell 3.13.5
          python -m pip install scvelo==0.3.3 anndata==0.11.4 scipy==1.15.2 zarr==2.18.7 tqdm ipywidgets

      - name: Save installed packages on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash -leo pipefail {0}
        run: |
          mkdir -p outputs
          pyenv activate jurassicpark-env
          python -m pip list --format=freeze > "outputs/${RUNNER_OS}-pyenv.txt"
          cat "outputs/${RUNNER_OS}-pyenv.txt"

      - name: Save installed packages on Windows
        if: runner.os == 'Windows'
        shell: pwsh {0}
        run: |
          New-Item -ItemType Directory -Path outputs -Force | Out-Null
          pyenv shell 3.13.5
          python -m pip list --format=freeze | Out-File -FilePath ("outputs/" + $env:RUNNER_OS + "-pyenv.txt") -Encoding utf8
          Get-Content ("outputs/" + $env:RUNNER_OS + "-pyenv.txt")

      - name: Run scvelo smoke test on macOS
        if: runner.os == 'macOS'
        shell: bash -leo pipefail {0}
        run: |
          pyenv activate jurassicpark-env
          python tests/scvelo/0.3.3.py

      - name: Run scvelo smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh {0}
        run: |
          pyenv shell 3.13.5
          python tests/scvelo/0.3.3.py

      - name: Upload installed packages artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-pyenv-packages
          path: outputs/${{ runner.os }}-pyenv.txt
          if-no-files-found: error
